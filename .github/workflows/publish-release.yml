name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Release package workflow run ID
        required: true
        type: string
      tag:
        description: Existing release tag
        required: true
        default: v1.0.1
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Download exact verified tag-build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: gh run download "$RUN_ID" --name PrivacyBrowser-1.0.1-release-assets --dir release
      - name: Confirm expected release files
        run: |
          test -s release/PrivacyBrowser-1.0.1-windows-x64-portable.zip
          test -s release/PrivacyBrowser-1.0.1-myst-lmprove-source-227d63b.tar.gz
          test -s release/PrivacyBrowser-1.0.1-SHA256SUMS.txt
          cd release
          sha256sum --check PrivacyBrowser-1.0.1-SHA256SUMS.txt
      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --title "Version 1.0.1" --notes-file docs/RELEASE_NOTES_1.0.1.md --draft=false --prerelease=false
