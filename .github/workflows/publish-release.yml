name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Release package workflow run ID
        required: true
        type: string
      tag:
        description: Existing release tag
        required: true
        default: v1.0.4
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Download exact verified tag-build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: gh run download "$RUN_ID" --name PrivacyBrowser-1.0.4-release-assets --dir release
      - name: Confirm expected release files
        run: |
          test -s release/PrivacyBrowser-1.0.4-windows-x64-portable.zip
          test -s release/PrivacyBrowser-1.0.4-myst-lmprove-source-227d63b.tar.gz
          test -s release/PrivacyBrowser-1.0.4-SHA256SUMS.txt
          cd release
          sha256sum --check PrivacyBrowser-1.0.4-SHA256SUMS.txt
      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "Privacy Browser Prototype Demo v1.0.4" --notes-file docs/RELEASE_NOTES_1.0.4.md --draft=false --prerelease=true
          else
            gh release create "$TAG" release/* --verify-tag --title "Privacy Browser Prototype Demo v1.0.4" --notes-file docs/RELEASE_NOTES_1.0.4.md --prerelease
          fi
