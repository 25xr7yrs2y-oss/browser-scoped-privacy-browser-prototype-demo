name: Windows tests

on:
  push:
  pull_request:

jobs:
  powershell-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate locked policy
        shell: powershell
        run: .\tests\Test-Configuration.ps1
      - name: Validate launcher invariants
        shell: powershell
        run: .\tests\Test-Launcher.ps1

